    <link rel="apple-touch-icon" href="/khrawk.png" />

    <title>Khrawk Labs</title>

      content="Khrawk Labs é uma software house em Maringá. Projetamos, desenvolvemos e mantemos software em produção — do banco de dados à interface. Também desenvolvemos landing pages e sites sob medida."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khrawk Labs" />
    <meta property="og:title" content="Khrawk Labs — Software house" />

      property="og:description"
      content="Projetamos, desenvolvemos e mantemos software em produção. Do banco de dados à interface."
    />
    <meta property="og:image" content="/khrawk.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Marca o documento ANTES da primeira pintura: sem isso o conteúdo
      // apareceria por um instante e só então seria escondido para revelar.
      // Se o JS falhar ou estiver desligado, a classe nunca entra e a página
      // renderiza inteira — o estado escondido depende dela.
      try {
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.className += " com-revelacao";
        }
      } catch (e) {
        /* navegador sem matchMedia: segue sem revelação */
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </body>
